[project]
name = "ai-employee"
version = "0.1.0"
description = "A minimal, OpenAI-compatible framework for stateful, optionally-autonomous AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-employee contributors" }]
keywords = ["ai", "agent", "llm", "memory", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
memory = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=2.5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = [
    "ai-employee[memory,dev]",
]

[project.scripts]
aie = "ai_employee.cli:main"

[project.urls]
Homepage = "https://github.com/kriisko-glitch/ai-employee"
Issues = "https://github.com/kriisko-glitch/ai-employee/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_employee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
